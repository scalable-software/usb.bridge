<svg width="680" height="375" viewBox="0 0 680 375" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SPI mode 0 timing diagram</title>
<desc>Four signal traces over time: chip select drops low, SCLK pulses eight times, MOSI sends byte 0x9F and MISO returns 0xA5, both sampled on each rising clock edge, then chip select returns high.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect x="0" y="0" width="680" height="375" fill="#ffffff"/>
<text class="ts" x="112" y="62">bus idle</text>
<text class="ts" x="381" y="90" text-anchor="middle">CS low — transaction active</text>
<text class="ts" x="630" y="62" text-anchor="end">idle</text>
<text class="t" x="40" y="88">CS</text>
<text class="ts" x="40" y="106">active low</text>
<path d="M110,70 H140 V98 H622 V70 H640" fill="none" stroke="#888780" stroke-width="2"/>
<text class="t" x="40" y="158">SCLK</text>
<text class="ts" x="40" y="176">idles low</text>
<text class="ts" x="210" y="128">data sampled on every SCLK rising edge</text>
<path d="M197,134 V314 M251,134 V314 M305,134 V314 M359,134 V314 M413,134 V314 M467,134 V314 M521,134 V314 M575,134 V314" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<path d="M110,168 H197 V140 H224 V168 H251 V140 H278 V168 H305 V140 H332 V168 H359 V140 H386 V168 H413 V140 H440 V168 H467 V140 H494 V168 H521 V140 H548 V168 H575 V140 H602 V168 H640" fill="none" stroke="#888780" stroke-width="2"/>
<text class="ts" x="40" y="200">bit</text>
<text class="ts" x="183" y="200" text-anchor="middle">7</text>
<text class="ts" x="237" y="200" text-anchor="middle">6</text>
<text class="ts" x="291" y="200" text-anchor="middle">5</text>
<text class="ts" x="345" y="200" text-anchor="middle">4</text>
<text class="ts" x="399" y="200" text-anchor="middle">3</text>
<text class="ts" x="453" y="200" text-anchor="middle">2</text>
<text class="ts" x="507" y="200" text-anchor="middle">1</text>
<text class="ts" x="561" y="200" text-anchor="middle">0</text>
<text class="t" x="40" y="228">MOSI</text>
<text class="ts" x="40" y="246">0x9F out</text>
<path d="M110,238 H170 V210 H224 V238 H332 V210 H622 V238 H640" fill="none" stroke="#1D9E75" stroke-width="2"/>
<text class="ts" x="183" y="226" text-anchor="middle">1</text>
<text class="ts" x="237" y="226" text-anchor="middle">0</text>
<text class="ts" x="291" y="226" text-anchor="middle">0</text>
<text class="ts" x="345" y="226" text-anchor="middle">1</text>
<text class="ts" x="399" y="226" text-anchor="middle">1</text>
<text class="ts" x="453" y="226" text-anchor="middle">1</text>
<text class="ts" x="507" y="226" text-anchor="middle">1</text>
<text class="ts" x="561" y="226" text-anchor="middle">1</text>
<text class="t" x="40" y="298">MISO</text>
<text class="ts" x="40" y="316">0xA5 in</text>
<text class="ts" x="112" y="286">high-Z</text>
<path d="M110,294 H170 M622,294 H640" fill="none" stroke="#7F77DD" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M170,294 V280 H224 V308 H278 V280 H332 V308 H440 V280 H494 V308 H548 V280 H622 V294" fill="none" stroke="#7F77DD" stroke-width="2"/>
<text class="ts" x="183" y="296" text-anchor="middle">1</text>
<text class="ts" x="237" y="296" text-anchor="middle">0</text>
<text class="ts" x="291" y="296" text-anchor="middle">1</text>
<text class="ts" x="345" y="296" text-anchor="middle">0</text>
<text class="ts" x="399" y="296" text-anchor="middle">0</text>
<text class="ts" x="453" y="296" text-anchor="middle">1</text>
<text class="ts" x="507" y="296" text-anchor="middle">0</text>
<text class="ts" x="561" y="296" text-anchor="middle">1</text>
<path d="M170,330 V352 M602,330 V352" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<text class="ts" x="386" y="336" text-anchor="middle">8 clock cycles = one byte, MSB first</text>
<line x1="176" y1="346" x2="596" y2="346" stroke="#888780" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
</svg>
